name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_and_release:
    name: Test, Build, and Release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: users
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U runner"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://runner:runner@localhost:5432/users
      DJANGO_ALLOWED_HOSTS: 'localhost 127.0.0.1 [::1]'
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      # Checkout the codebase
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Python environment for testing
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Install dependencies
      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt

      # Run tests with pytest
      - name: Run tests with Pytest
        run: |
          cd app
          pytest -p no:warnings --cov=.

      # Lint with Black
      - name: Run Black
        run: |
          cd app
          black --check . --exclude 'movies/migrations'

      # Lint with Ruff (including isort)
      - name: Run Ruff (including isort)
        run: |
          cd app
          ruff check . --fix --exclude 'tests/*,movies/migrations/*,tasks.py,drf_project/settings.py'

      # If tests and linting pass, proceed to build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      # Heroku login for both Docker and CLI
      - name: Heroku Container Login
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          echo $HEROKU_API_KEY | docker login --username=$HEROKU_EMAIL --password-stdin registry.heroku.com
          heroku container:push --recursive --context-path=development/Dockerfile.prod --app ${{ secrets.HEROKU_APP_NAME }}

      - name: Heroku Container Login and Release App
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          heroku container:login
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME }}