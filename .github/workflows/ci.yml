name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Export Requirements
  export-requirements:
    name: Export Requirements
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"

      - name: Export Requirements
        run: |
          poetry export -f requirements.txt --output app/requirements.txt --without-hashes
          poetry export -f requirements.txt --with dev --output app/requirements-dev.txt --without-hashes

# Test Stage in GitHub Actions
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    needs: export-requirements

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r app/requirements-dev.txt

      - name: Run tests with Pytest
        run: |
          cd app
          pytest -p no:warnings --cov=.

      - name: Run Black
        run: |
          cd app
          black --check . --exclude 'movies/migrations'

      - name: Run Ruff (including isort)
        run: |
          cd app
          ruff check . --fix --exclude 'tests/*,movies/migrations/*,tasks.py,drf_project/settings.py'


  # Production Build Stage
  build-prod:
    name: Build Production Docker Image
    runs-on: ubuntu-latest
    needs: test-and-lint  # Wait for build-and-test job to complete

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Build and Push Production Docker image
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          docker buildx build \
            --target prod \
            --platform linux/amd64 \
            --file development/Dockerfile.prod \
            --tag ${{ secrets.DOCKER_USERNAME }}/myapp:$IMAGE_TAG \
            --push \
            .

  # Release Stage
  release:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: build-prod  # Wait for build-prod job to complete

    steps:
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/myapp:$IMAGE_TAG

      - name: Deploy to Heroku
        run: |
          heroku container:push web --app ${{ secrets.HEROKU_APP_NAME }} --arg IMAGE_TAG=$IMAGE_TAG
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME }}
