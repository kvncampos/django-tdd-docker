name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull existing Docker image
        run: |
          docker pull ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}:latest || true

      - name: Build Docker image
        run: |
          docker build \
            --cache-from ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}:latest \
            --tag ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}:latest \
            --file ./development/Dockerfile.prod \
            "."

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}:latest

  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: users
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U runner"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://runner:runner@localhost:5432/users

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'  # Adjust as needed

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Run tests with Pytest
        run: |
          cd app
          pytest -p no:warnings --cov=.

      - name: Run Flake8
        run: |
          cd app
          flake8 .

      - name: Run Black
        run: |
          cd app
          black --check --exclude=migrations .

      - name: Run Ruff (including isort)
        run: |
          cd app
          ruff check . --fix
