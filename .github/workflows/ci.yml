name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Build Stage
  build:
    name: Build and Push Dev Docker Image
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Build and Push Dev Docker Image
        run: |
          docker buildx build \
            --cache-from ${{ secrets.DOCKER_USERNAME }}/${{ secrets.HEROKU_APP_NAME }}:latest \
            --cache-from ${{ secrets.DOCKER_USERNAME }}/${{ secrets.HEROKU_APP_NAME }}:builder \
            --build-arg SECRET_KEY=${{ secrets.SECRET_KEY }} \
            --platform linux/amd64 \
            --file ./development/Dockerfile.prod \
            --tag ${{ secrets.DOCKER_USERNAME }}/${{ secrets.HEROKU_APP_NAME }}:latest \
            --push \
            .

  # Test Stage
  test:
    name: Test and Lint with Dev Image
    runs-on: ubuntu-latest
    needs: build  # Wait for build job to complete
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: users
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U runner"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Pull Dev Docker Image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.HEROKU_APP_NAME }}:latest

      - name: Run Tests Inside Docker Container
        run: |
          docker run --rm \
            -e DATABASE_URL=${{ vars.DATABASE_URL }} \
            -e DJANGO_ALLOWED_HOSTS=${{ vars.DJANGO_ALLOWED_HOSTS }} \
            -e SECRET_KEY=${{ secrets.SECRET_KEY }} \
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.HEROKU_APP_NAME }}:latest \
            pytest -p no:warnings

      - name: Run Linting Inside Docker Container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/app:/usr/src/app \
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.HEROKU_APP_NAME }}:latest \
            bash -c "flake8 . && black --check . --exclude='migrations|env' && isort . --check-only"

  # Deploy Stage
  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: test  # Wait for test job to complete
    services:
      docker:
        image: docker:stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Build Docker Image for Heroku
        run: |
          docker build \
            --file ./development/Dockerfile.prod \
            --build-arg SECRET_KEY=${{ secrets.SECRET_KEY }} \
            --tag registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web \
            .

      - name: Push Docker Image to Heroku
        run: |
          docker login -u _ -p ${{ secrets.HEROKU_AUTH_TOKEN }} registry.heroku.com
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web

      - name: Deploy Image to Heroku
        run: |
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME }}
