name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Build Stage
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Pull Cache Image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.REPOSITORY_NAME }}:latest || true

      - name: Build Docker Image
        run: |
          docker build \
            --cache-from ${{ secrets.DOCKER_USERNAME }}/${{ secrets.REPOSITORY_NAME }}:latest \
            --tag ${{ secrets.DOCKER_USERNAME }}/${{ secrets.REPOSITORY_NAME }}:latest \
            --file Dockerfile.prod \
            --build-arg SECRET_KEY=${{ secrets.SECRET_KEY }} \
            .

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.REPOSITORY_NAME }}:latest

  # Test Stage
  test:
    name: Test with Docker Image
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: users
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U runner"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://runner:runner@localhost:5432/users
      DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1 [::1]"
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Pull Docker Image for Testing
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.REPOSITORY_NAME }}:latest

      - name: Run Tests and Linting
        run: |
          docker run --rm \
            --network=host \
            -e DATABASE_URL=$DATABASE_URL \
            -e DJANGO_ALLOWED_HOSTS=$DJANGO_ALLOWED_HOSTS \
            -e SECRET_KEY=$SECRET_KEY \
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.REPOSITORY_NAME }}:latest \
            bash -c "
              export DEBUG=1 &&
              pytest -p no:warnings --cov=. &&
              black . --check --exclude='migrations|env' &&
              isort . --check-only --skip env &&
              export DEBUG=0 &&
              python manage.py check --deploy --fail-level=WARNING
            "

  # Deploy Stage
  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo $HEROKU_API_KEY | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build and Tag Heroku Docker Image
        run: |
          docker build \
            --tag registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:latest \
            --file Dockerfile.prod \
            --build-arg SECRET_KEY=${{ secrets.SECRET_KEY }} \
            .

      - name: Push to Heroku Container Registry
        run: |
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:latest

      - name: Release on Heroku
        run: |
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME }}
