name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Build Stage
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"

      - name: Export requirements.txt from poetry.lock
        run: |
          poetry export -f requirements.txt --output app/requirements.txt --without-hashes

      - name: Check if requirements.txt is generated and non-empty
        run: |
          if [ ! -s app/requirements.txt ]; then
            echo "Error: requirements.txt is either missing or empty."
            exit 1
          else
            echo "requirements.txt generated successfully."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Heroku Login with API Key
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo $HEROKU_API_KEY | heroku auth:token

      - name: Docker Login to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          echo $HEROKU_API_KEY | docker login --username=$HEROKU_EMAIL --password-stdin registry.heroku.com

      - name: Pull the latest Docker image from Heroku (if exists)
        run: |
          docker pull registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:latest || true

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:latest \
            --file development/Dockerfile.prod \
            --tag registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:latest \
            .

      - name: Push Docker image to Heroku
        run: |
          docker push registry.heroku.com/${{ secrets.HEROKU_APP_NAME }}/web:latest

  # Test Stage
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    needs: build  # Wait for build stage to complete
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: users
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U runner"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://runner:runner@localhost:5432/users
      DJANGO_ALLOWED_HOSTS: 'localhost 127.0.0.1 [::1]'
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'  # Adjust as needed

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Run tests with Pytest
        run: |
          cd app
          pytest -p no:warnings --cov=.

      - name: Run Black
        run: |
          cd app
          black --check . --exclude 'movies/migrations'

      - name: Run Ruff (including isort)
        run: |
          cd app
          ruff check . --fix --exclude 'tests/*,movies/migrations/*,tasks.py,drf_project/settings.py'

  # Release Stage
  release:
    name: Release Docker Image on Heroku
    runs-on: ubuntu-latest
    needs: test  # Wait for test stage to complete

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Docker Login to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          echo $HEROKU_API_KEY | docker login --username=$HEROKU_EMAIL --password-stdin registry.heroku.com
          heroku container:login

      - name: Heroku Container Login and Release App
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:login
          heroku container:release web --app ${{ secrets.HEROKU_APP_NAME }}